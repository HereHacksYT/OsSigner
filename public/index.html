<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OsSigner - IPA İmzalayıcı</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 500px; width: 100%; background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1 { text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #bbb; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; background: #007bff; color: white; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:disabled { background: #555; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; }
        .error { color: #ff4d4d; }
        .success { color: #28a745; }
        a.download-btn { display: block; text-align: center; margin-top: 10px; background: #28a745; color: white; padding: 10px; text-decoration: none; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>OsSigner</h1>
    
    <form id="signForm">
        <div class="form-group">
            <label>IPA Dosyası Seç</label>
            <input type="file" id="ipaFile" accept=".ipa">
        </div>

        <div class="form-group">
            <label>VEYA Direkt URL Girin</label>
            <input type="text" id="ipaUrl" placeholder="https://example.com/file.ipa">
        </div>

        <div class="form-group">
            <label>Özel Sertifika (.p12) [Opsiyonel]</label>
            <input type="file" id="p12File" accept=".p12">
        </div>

        <div class="form-group">
            <label>Sertifika Şifresi</label>
            <input type="text" id="password" placeholder="Varsayılan: NexCerts">
        </div>

        <div class="form-group">
            <label>Mobil Provision (.mobileprovision) [Opsiyonel]</label>
            <input type="file" id="provFile" accept=".mobileprovision">
        </div>

        <button type="submit" id="submitBtn">İmzala ve Hazırla</button>
    </form>

    <div id="status"></div>
</div>

<script>
document.getElementById('signForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');
    
    const ipaFile = document.getElementById('ipaFile').files[0];
    const ipaUrl = document.getElementById('ipaUrl').value.trim();
    const p12File = document.getElementById('p12File').files[0];
    const password = document.getElementById('password').value.trim();
    const provFile = document.getElementById('provFile').files[0];

    if (!ipaFile && !ipaUrl) {
        statusDiv.className = 'error';
        statusDiv.innerText = 'Lütfen bir IPA dosyası seçin veya bir URL girin.';
        return;
    }

    const formData = new FormData();
    if (ipaFile) formData.append('ipa', ipaFile);
    if (ipaUrl) formData.append('ipaUrl', ipaUrl);
    if (p12File) formData.append('p12', p12File);
    if (password) formData.append('password', password);
    if (provFile) formData.append('mobileprovision', provFile);

    submitBtn.disabled = true;
    statusDiv.className = '';
    statusDiv.innerText = 'İmzalanıyor, lütfen bekleyin...';

    try {
        // Doğrudan mevcuttaki domaine istek atar
        const response = await fetch('/api/sign', {
            method: 'POST',
            body: formData
        });

        const data = await response.json();

        if (response.ok && data.success) {
            statusDiv.className = 'success';
            statusDiv.innerHTML = `
                <p>${data.message}</p>
                <a href="${data.downloadUrl}" class="download-btn" target="_blank">İmzalı IPA'yı İndir</a>
            `;
        } else {
            statusDiv.className = 'error';
            statusDiv.innerText = 'Hata: ' + (data.error || 'İmzalama başarısız.');
        }
    } catch (err) {
        statusDiv.className = 'error';
        statusDiv.innerText = 'Sunucuyla bağlantı kurulamadı.';
    } finally {
        submitBtn.disabled = false;
    }
});
</script>

</body>
</html>
