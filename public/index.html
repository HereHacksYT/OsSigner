<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPA İmzalama Servisi</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
    .field { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="file"], input[type="password"] { width: 100%; }
    button { padding: 10px 20px; background: #0070f3; color: white; border: none; border-radius: 5px; cursor: pointer; }
    #result { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>IPA Imzalayici</h2>
  <form id="signForm">
    <div class="field">
      <label>IPA Dosyasi (Zorunlu):</label>
      <input type="file" name="ipa" accept=".ipa" required>
    </div>
    
    <hr>
    <p><small>Kendi sertifikanizi yuklemezseniz varsayilan sertifika kullanilir.</small></p>

    <div class="field">
      <label>Sertifika (.p12) - İsteğe Bağlı:</label>
      <input type="file" name="cert" accept=".p12">
    </div>

    <div class="field">
      <label>Provision Profil (.mobileprovision) - İsteğe Bağlı:</label>
      <input type="file" name="provision" accept=".mobileprovision">
    </div>

    <div class="field">
      <label>Sertifika Şifresi:</label>
      <input type="password" name="password" placeholder="Özel sertifika şifreniz">
    </div>

    <button type="submit">İmzala</button>
  </form>

  <div id="result"></div>

  <script>
    document.getElementById('signForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const resultDiv = document.getElementById('result');
      resultDiv.innerText = 'Dosya işleniyor ve imzalanıyor...';

      const formData = new FormData(e.target);

      try {
        const response = await fetch('/sign', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (response.ok) {
          resultDiv.innerHTML = `<span style="color:green">${data.message}</span><br><a href="${data.downloadUrl}" download>İmzalanmış IPA'yı İndir</a>`;
        } else {
          resultDiv.innerHTML = `<span style="color:red">Hata: ${data.error}</span>`;
        }
      } catch (err) {
        resultDiv.innerHTML = '<span style="color:red">Bir bağlantı hatası oluştu.</span>';
      }
    });
  </script>
</body>
</html>
